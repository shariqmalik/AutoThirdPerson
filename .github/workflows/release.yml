name: Release Mod

on:
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod JAR
        run: ./gradlew :Fabric-26.1.2:build -x test --info --stacktrace

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: Fabric-26.1.2/build/libs/auto_third_person-fabric-26.1.2-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto_third_person-fabric-26.1.2
          path: Fabric-26.1.2/build/libs/auto_third_person-fabric-26.1.2-*.jar
